<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洄瀾永續探索地圖｜花蓮SDGs大富翁</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ══ DESIGN SYSTEM：稻米白底 × 墨綠 × 金（淺色系全版） ══ */
:root {
  --ink:       #f7f2e8;
  --ink-deep:  #ede8da;
  --forest:    #2d5a3d;
  --forest-mid:#3d7050;
  --forest-lt: #2a5035;
  --gold:      #8a6200;
  --gold-mid:  #a67800;
  --gold-lt:   #b88a00;
  --rice:      #f7f2e8;
  --rice-dk:   #e2d8c4;
  --parchment: #faf6ee;
  --text-dk:   #1a2010;
  --text-md:   #2d3d22;
  --text-lt:   #ffffff;
  --border:    #2d5a3d;

  --sdg1:#c0182a; --sdg2:#b87000; --sdg3:#2e7a1e;
  --sdg4:#a01020; --sdg5:#b82800; --sdg6:#0f6e8a; --sdg7:#a08000;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family:'Noto Sans TC', sans-serif;
  background: var(--ink);
  color: var(--text-dk);
  min-height:100vh;
  overflow-x:hidden;
  font-size:17px;
}

.screen { display:none; min-height:100vh; }
.screen.active { display:flex; flex-direction:column; }

/* ══════════════════════════════════════════
   TITLE SCREEN
══════════════════════════════════════════ */
#screen-title {
  background:
    radial-gradient(ellipse 100% 40% at 50% 110%, rgba(184,134,11,0.12) 0%, transparent 65%),
    radial-gradient(ellipse 60% 35% at 15% 80%, rgba(45,90,61,0.18) 0%, transparent 55%),
    linear-gradient(160deg, #f0eadb 0%, #e8e2d0 50%, #ede4cc 100%);
  align-items:center; justify-content:center;
  position:relative; overflow:hidden;
}

.stars { position:absolute; inset:0; pointer-events:none; }
.star {
  position:absolute; background:var(--forest); border-radius:50%; opacity:0.25;
  animation:twinkle 3s ease-in-out infinite;
}
@keyframes twinkle {
  0%,100%{opacity:0.15;transform:scale(1);}
  50%{opacity:0.9;transform:scale(1.6);}
}

.title-scene {
  position:absolute; bottom:0; left:0; right:0;
  height:50%; pointer-events:none;
}

.title-content {
  position:relative; z-index:10;
  text-align:center; padding:2rem;
  animation:fadeUp 0.9s ease-out;
}
@keyframes fadeUp {
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}

.title-badge {
  display:inline-block;
  background:rgba(45,90,61,0.1);
  border:1px solid var(--forest);
  border-radius:20px; padding:0.35rem 1.1rem;
  font-size:0.88rem; letter-spacing:0.12em;
  color:var(--forest); margin-bottom:1.3rem;
}

.title-main {
  font-family:'Noto Serif TC', serif;
  font-size:clamp(2.2rem,8vw,3.5rem); font-weight:900;
  line-height:1.2; margin-bottom:0.5rem;
  background:linear-gradient(135deg, var(--forest) 0%, var(--gold-mid) 55%, var(--forest-mid) 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}
.title-sub {
  font-family:'DM Serif Display', serif; font-style:italic;
  font-size:clamp(1.05rem,3vw,1.4rem);
  color:rgba(45,90,61,0.6); letter-spacing:0.08em; margin-bottom:0.9rem;
}
.title-desc {
  font-size:1rem; color:rgba(26,32,16,0.62);
  max-width:320px; margin:0 auto 2rem; line-height:1.8;
}

.sdg-dots {
  display:flex; gap:0.4rem; justify-content:center; margin-bottom:2.2rem;
}
.sdg-dot {
  width:32px;height:32px; border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:0.7rem;font-weight:700;color:white;
  animation:dotPop 0.4s ease-out both;
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
}
@keyframes dotPop{from{opacity:0;transform:scale(0)rotate(-15deg);}to{opacity:1;transform:scale(1)rotate(0);}}
.sdg-dot:nth-child(1){background:var(--sdg1);animation-delay:.08s;}
.sdg-dot:nth-child(2){background:var(--sdg2);animation-delay:.16s;}
.sdg-dot:nth-child(3){background:var(--sdg3);animation-delay:.24s;}
.sdg-dot:nth-child(4){background:var(--sdg4);animation-delay:.32s;}
.sdg-dot:nth-child(5){background:var(--sdg5);animation-delay:.40s;}
.sdg-dot:nth-child(6){background:var(--sdg6);animation-delay:.48s;}
.sdg-dot:nth-child(7){background:var(--sdg7);animation-delay:.56s;}

.btn-start {
  background:linear-gradient(135deg, var(--forest), var(--forest-mid));
  color:var(--rice); border:2px solid var(--gold);
  padding:1.1rem 2.8rem; border-radius:50px;
  font-size:1.1rem; font-family:'Noto Serif TC',serif; font-weight:700;
  cursor:pointer; letter-spacing:0.08em;
  box-shadow:0 6px 28px rgba(184,134,11,0.3);
  transition:all 0.25s;
}
.btn-start:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 36px rgba(184,134,11,0.45);
  border-color:var(--gold-lt);
}

/* ══════════════════════════════════════════
   GAME SCREEN
══════════════════════════════════════════ */
#screen-game {
  background: linear-gradient(160deg, #f4eedd 0%, #ede4cc 100%);
  flex-direction:column;
}

.game-header {
  padding:1rem 1.3rem 0.8rem;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:2px solid rgba(45,90,61,0.2); flex-shrink:0;
  background:rgba(247,242,232,0.9); backdrop-filter:blur(8px);
}
.game-title-small {
  font-family:'Noto Serif TC',serif; font-size:1.05rem; font-weight:700;
  color:var(--forest); letter-spacing:0.05em;
}
.progress-info {
  font-size:0.88rem; color:var(--forest);
  background:rgba(45,90,61,0.1); border:1px solid rgba(45,90,61,0.25);
  padding:0.25rem 0.8rem; border-radius:20px;
}

/* MAP */
.map-area {
  flex:1; position:relative; overflow:hidden; min-height:0;
}

#hualien-map-svg {
  position:absolute; inset:0; width:100%; height:100%;
}

/* ── TOWNSHIP REGIONS (clickable SVG paths) ── */
.township {
  cursor:pointer;
  transition:opacity 0.2s, filter 0.2s;
}
.township:hover { opacity:0.85; filter:brightness(1.12); }
.township.active-stop { filter:brightness(1.25) drop-shadow(0 0 8px rgba(184,134,11,0.8)); }

/* Stop pins */
.map-stop {
  position:absolute; transform:translate(-50%,-50%);
  cursor:pointer; z-index:10; transition:transform 0.25s;
}
.map-stop:hover { transform:translate(-50%,-50%) scale(1.18); }

.stop-pin {
  width:50px; height:50px; border-radius:50%;
  border:3px solid rgba(247,242,232,0.3);
  display:flex; align-items:center; justify-content:center;
  font-size:1.25rem; position:relative;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
  transition:all 0.3s; backdrop-filter:blur(4px);
}
.stop-pin.unlocked { cursor:pointer; }
.stop-pin.current {
  border-color:var(--gold-lt);
  animation:pulsePing 1.5s ease-in-out infinite;
}
.stop-pin.visited {
  border-color:rgba(247,242,232,0.7);
  box-shadow:0 0 20px rgba(184,134,11,0.4);
}
/* ALL pins are clickable now */
.stop-pin { cursor:pointer; }

@keyframes pulsePing {
  0%,100%{box-shadow:0 0 0 0 rgba(184,134,11,0.5),0 4px 20px rgba(0,0,0,0.5);}
  50%{box-shadow:0 0 0 16px rgba(184,134,11,0),0 4px 20px rgba(0,0,0,0.5);}
}

.stop-sdg-badge {
  position:absolute; top:-9px; right:-9px;
  width:22px; height:22px; border-radius:5px;
  font-size:0.6rem; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  color:white; border:2px solid var(--rice);
  box-shadow:0 2px 6px rgba(0,0,0,0.4);
}
.stop-label {
  position:absolute; bottom:-24px; left:50%;
  transform:translateX(-50%); white-space:nowrap;
  font-size:0.76rem; color:var(--forest); font-weight:700;
  text-shadow:none; letter-spacing:0.02em;
  background:rgba(247,242,232,0.92); border:1px solid rgba(45,90,61,0.25);
  padding:1px 6px; border-radius:4px;
}

.stop-visited-mark {
  position:absolute; bottom:-6px; right:-6px;
  width:18px; height:18px; background:var(--forest-mid);
  border-radius:50%; display:none;
  align-items:center; justify-content:center;
  font-size:0.6rem; color:white; font-weight:700;
  border:2px solid var(--rice);
}
.stop-visited-mark.show{display:flex;}

.player-token {
  position:absolute; width:32px; height:32px;
  background:var(--gold-lt); border-radius:50%;
  transform:translate(-50%,-50%); z-index:20;
  display:flex; align-items:center; justify-content:center;
  font-size:1.1rem;
  box-shadow:0 4px 16px rgba(0,0,0,0.6), 0 0 0 3px rgba(184,134,11,0.5);
  transition:all 0.85s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events:none;
}

/* ── BOTTOM PANEL ── */
.bottom-panel {
  background:rgba(247,242,232,0.97);
  backdrop-filter:blur(20px);
  border-top:2px solid rgba(45,90,61,0.18);
  padding:1rem 1.2rem; flex-shrink:0;
  box-shadow:0 -4px 20px rgba(45,90,61,0.08);
}

.dice-area {
  display:flex; align-items:center; gap:1rem; margin-bottom:0.9rem;
}
.dice-display {
  width:58px; height:58px; flex-shrink:0;
  background:rgba(45,90,61,0.08);
  border:2px solid rgba(45,90,61,0.3); border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  font-size:2rem; transition:all 0.2s;
}
.dice-display.rolling{animation:diceShake 0.5s ease-in-out;}
@keyframes diceShake{
  0%,100%{transform:rotate(0);}
  20%{transform:rotate(-16deg)scale(1.12);}
  40%{transform:rotate(16deg)scale(1.16);}
  60%{transform:rotate(-10deg)scale(1.1);}
  80%{transform:rotate(10deg)scale(1.05);}
}
.dice-info{flex:1;}
.dice-result{font-size:0.92rem;color:rgba(26,32,16,0.6);margin-bottom:0.25rem;}
.dice-result strong{color:var(--forest);font-size:1.05rem;}
.position-text{font-size:0.82rem;color:rgba(26,32,16,0.45);}

.btn-roll {
  background:linear-gradient(135deg, var(--forest), var(--forest-mid));
  color:var(--rice); border:2px solid var(--gold);
  padding:0.8rem 1.5rem; border-radius:30px;
  font-size:0.95rem; font-family:'Noto Sans TC',sans-serif; font-weight:600;
  cursor:pointer; flex-shrink:0; transition:all 0.2s;
  box-shadow:0 4px 16px rgba(184,134,11,0.25);
}
.btn-roll:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(184,134,11,0.4);}
.btn-roll:disabled{opacity:0.35;cursor:not-allowed;transform:none;}

.stop-preview {
  background:rgba(45,90,61,0.06);
  border:1px solid rgba(45,90,61,0.2); border-radius:12px;
  padding:0.8rem 1rem; display:flex; align-items:center; gap:0.8rem;
}
.preview-emoji{font-size:1.6rem;flex-shrink:0;}
.preview-text{flex:1;}
.preview-name{font-size:0.96rem;font-weight:600;color:var(--text-dk);margin-bottom:0.18rem;}
.preview-sdg{font-size:0.82rem;color:rgba(26,32,16,0.5);}
.btn-explore {
  background:linear-gradient(135deg,var(--gold),var(--gold-mid));
  color:var(--ink-deep); border:none; padding:0.55rem 1rem;
  border-radius:20px; font-size:0.82rem;
  font-family:'Noto Sans TC',sans-serif; font-weight:700;
  cursor:pointer; flex-shrink:0; transition:all 0.2s;
}
.btn-explore:hover{transform:translateY(-2px);}

/* ══════════════════════════════════════════
   CARD OVERLAY
══════════════════════════════════════════ */
#screen-card {
  position:fixed; inset:0; z-index:100;
  background:rgba(232,224,200,0.88); backdrop-filter:blur(12px);
  align-items:center; justify-content:center; padding:1.2rem;
  display:none;
}
#screen-card.active{display:flex;}

.card-container {
  background:linear-gradient(160deg, #faf6ee, #f4edd8);
  border-radius:24px;
  border:1px solid rgba(45,90,61,0.2);
  box-shadow:0 0 0 1px rgba(45,90,61,0.08), 0 20px 60px rgba(26,32,16,0.18);
  max-width:440px; width:100%; overflow:hidden;
  animation:cardUp 0.4s cubic-bezier(0.34,1.56,0.64,1);
  max-height:90vh; overflow-y:auto;
}
@keyframes cardUp{
  from{opacity:0;transform:translateY(40px)scale(0.93);}
  to{opacity:1;transform:translateY(0)scale(1);}
}

.card-header{padding:1.5rem 1.5rem 1rem;position:relative;}

.card-sdg-tag {
  display:inline-flex; align-items:center; gap:0.4rem;
  padding:0.35rem 0.9rem; border-radius:20px;
  font-size:0.82rem; font-weight:700; color:white;
  letter-spacing:0.08em; margin-bottom:0.9rem;
}

.card-location-name {
  font-family:'Noto Serif TC',serif; font-size:1.5rem; font-weight:700;
  color:var(--text-dk); margin-bottom:0.35rem; line-height:1.3;
}
.card-region{font-size:0.86rem;color:rgba(26,32,16,0.5);}
.card-hero-emoji{font-size:3.8rem;text-align:center;padding:0.8rem 0 0.5rem;}

/* Gold top border on card */
.card-gold-bar {
  height:4px;
  background:linear-gradient(90deg, transparent, var(--gold), var(--gold-lt), var(--gold), transparent);
}

.card-divider{height:1px;background:rgba(45,90,61,0.12);margin:0 1.5rem;}

.card-body{padding:1.1rem 1.5rem;}
.card-story{
  font-size:0.95rem; color:rgba(26,32,16,0.72);
  line-height:1.88; margin-bottom:1.1rem;
}

/* Snapshot */
.snapshot-mini {
  background:rgba(138,98,0,0.08);
  border:1px solid rgba(138,98,0,0.25);
  border-radius:14px; padding:0.9rem 1.1rem; margin-bottom:1.1rem;
}
.snapshot-mini-title {
  font-size:0.76rem; font-weight:700; color:var(--gold);
  letter-spacing:0.1em; text-transform:uppercase; margin-bottom:0.7rem;
}
.snapshot-row {
  display:flex; justify-content:space-between; align-items:baseline;
  padding:0.32rem 0; border-bottom:1px solid rgba(247,242,232,0.05);
  font-size:0.86rem;
}
.snapshot-row:last-child{border-bottom:none;}
.snapshot-label{color:rgba(26,32,16,0.52);}
.snapshot-value{color:var(--text-dk);font-weight:600;text-align:right;max-width:58%;}

/* Task */
.task-box {
  background:rgba(45,90,61,0.07);
  border:1px solid rgba(45,90,61,0.22);
  border-radius:14px; padding:1rem 1.1rem; margin-bottom:1rem;
}
.task-title {
  font-size:0.76rem; font-weight:700; color:var(--forest);
  letter-spacing:0.1em; margin-bottom:0.55rem; text-transform:uppercase;
}
.task-content{font-size:0.94rem;color:rgba(26,32,16,0.78);line-height:1.75;}
.task-options{display:flex;flex-direction:column;gap:0.55rem;margin-top:0.8rem;}
.task-option {
  background:rgba(247,242,232,0.7);
  border:1px solid rgba(45,90,61,0.18);
  border-radius:10px; padding:0.78rem 1rem; font-size:0.9rem;
  color:rgba(26,32,16,0.78); cursor:pointer; transition:all 0.2s; text-align:left;
}
.task-option:hover{background:rgba(45,90,61,0.12);border-color:rgba(45,90,61,0.4);color:var(--forest);}
.task-option.correct{background:rgba(45,90,61,0.18);border-color:var(--forest);color:var(--forest);}
.task-option.wrong{background:rgba(200,30,30,0.05);border-color:rgba(200,30,30,0.2);color:rgba(26,32,16,0.4);}

.answer-feedback {
  font-size:0.9rem; padding:0.6rem 0.9rem; border-radius:10px;
  margin-top:0.6rem; display:none; line-height:1.65;
}
.answer-feedback.show{display:block;}
.answer-feedback.right{background:rgba(45,90,61,0.12);color:var(--forest);}
.answer-feedback.wrong-fb{background:rgba(138,98,0,0.1);color:var(--gold);}

.card-footer{padding:0.9rem 1.5rem 1.5rem;display:flex;gap:0.8rem;}
.btn-continue {
  flex:1; background:linear-gradient(135deg,var(--forest),var(--forest-mid));
  color:var(--text-lt); border:2px solid var(--forest-mid);
  padding:0.88rem; border-radius:14px;
  font-size:0.95rem; font-family:'Noto Serif TC',serif; font-weight:700;
  cursor:pointer; transition:all 0.2s; letter-spacing:0.05em;
}
.btn-continue:hover{opacity:0.9;transform:translateY(-1px);}
.btn-close-card {
  background:rgba(45,90,61,0.06);
  color:rgba(26,32,16,0.55);
  border:1px solid rgba(45,90,61,0.2);
  padding:0.88rem 1.1rem; border-radius:14px;
  font-size:0.9rem; cursor:pointer; transition:all 0.2s;
}
.btn-close-card:hover{background:rgba(45,90,61,0.12);color:var(--forest);}

/* ══════════════════════════════════════════
   COMPLETE SCREEN
══════════════════════════════════════════ */
#screen-complete {
  background:radial-gradient(ellipse at 50% 110%, rgba(45,90,61,0.25) 0%, var(--ink) 65%);
  align-items:center; justify-content:center; text-align:center; padding:2rem;
}
.complete-emoji{font-size:4.5rem;margin-bottom:1rem;animation:bounce 1.2s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-16px);}}
.complete-title {
  font-family:'Noto Serif TC',serif; font-size:2rem; font-weight:900;
  background:linear-gradient(135deg, var(--forest) 0%, var(--gold-mid) 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text; margin-bottom:0.6rem;
}
.complete-sub{font-size:1rem;color:rgba(26,32,16,0.6);margin-bottom:1.5rem;line-height:1.8;}
.complete-sdgs{
  display:grid; grid-template-columns:repeat(7,1fr); gap:0.5rem;
  margin-bottom:1.5rem; max-width:340px; margin-left:auto; margin-right:auto;
}
.complete-sdg {
  aspect-ratio:1; border-radius:9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:0.7rem;font-weight:700;color:white;padding:4px;
  animation:popIn 0.4s ease-out both;
}
@keyframes popIn{from{opacity:0;transform:scale(0.4)rotate(-15deg);}to{opacity:1;transform:scale(1)rotate(0);}}
.complete-book {
  background:rgba(45,90,61,0.07);
  border:1px solid rgba(45,90,61,0.2);
  border-radius:18px; padding:1.3rem; max-width:340px;
  margin:0 auto 1.5rem; font-size:0.94rem;
  color:rgba(26,32,16,0.65); line-height:1.88;
}
.complete-book strong{color:var(--forest);}
.btn-restart {
  background:rgba(45,90,61,0.08);
  color:rgba(26,32,16,0.6);
  border:1px solid rgba(45,90,61,0.2);
  padding:0.8rem 1.8rem; border-radius:30px;
  font-size:0.94rem; cursor:pointer; transition:all 0.2s;
}
.btn-restart:hover{background:rgba(45,90,61,0.15);color:var(--forest);}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(45,90,61,0.3);border-radius:2px;}
</style>
</head>
<body>

<!-- ══ TITLE ══ -->
<div id="screen-title" class="screen active">
  <div class="stars" id="stars"></div>
  <svg class="title-scene" viewBox="0 0 400 220" preserveAspectRatio="none">
    <defs>
      <linearGradient id="tmtn1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2d5a3d" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#1a3d27" stop-opacity="0.2"/>
      </linearGradient>
      <linearGradient id="tmtn2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4a7c5a" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#2d5a3d" stop-opacity="0.15"/>
      </linearGradient>
      <linearGradient id="tgold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d4a017" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#b8860b" stop-opacity="0.15"/>
      </linearGradient>
    </defs>

    snapshot:[

    ],

    feedbackWrong:'法律與教育都很重要，但SDG5的核心挑戰在於根深柢固的文化偏見與社會期待。',

  },
  {
    id:6, sdg:6, color:'#26bde2', emoji:'💧',
    name:'壽豐秀姑巒溪流域守護隊', region:'壽豐鄉',
    mapX:68, mapY:27,   // 壽豐鄉 center
    story:'秀姑巒溪是花蓮最重要的水脈。一群素人志工，每月巡守12公里溪岸，用手機記錄水質、移除外來種、教導下游居民理解上游的選擇如何影響他們的水。',
    snapshot:[
      {label:'守護流域長度',value:'12公里（月巡守）'},
      {label:'水質監測點',value:'8個自主監測站'},
      {label:'受益下游人口',value:'逾2.3萬人'},
    ],
    task:'水資源治理最難突破的是？',
    options:['技術不足','上下游之間缺乏連結感','政府經費不夠'],
    answer:1,
    feedback:'說得精準！SDG6的核心挑戰是「系統性的水資源共識」——住在上游的人要理解，他們的每個選擇，都流向了下游的杯子。',
    feedbackWrong:'技術和經費都是工具，SDG6最難的是讓所有人感受到自己與水系統的連結，進而改變行為。',
    ecoBiz:'適合：企業水資源ESG揭露、流域保護公益合作',
  },
  {
    id:7, sdg:7, color:'#fcc30b', emoji:'☀️',
    name:'秀林竹炭暨太陽能合作社', region:'秀林鄉',
    mapX:35, mapY:17,   // 秀林鄉 center (large NW township)
    story:'深山裡的太魯閣族人發現了一件事：祖先的竹炭技術，竟然是現代碳匯的在地解方。他們組了合作社，一邊燒竹炭固碳，一邊架太陽能板賣電。「潔淨能源不用從都市進口，我們山上就有。」',
    snapshot:[
      {label:'竹炭固碳量',value:'約18公噸CO₂e/年'},
      {label:'太陽能裝置容量',value:'45kW（社區自發自用）'},
      {label:'能源費用節省',value:'受益12戶省約40%'},
    ],
    task:'「能源民主」的核心精神是？',
    options:['全面依賴再生能源','讓社區掌握自己的能源','降低電費'],
    answer:1,
    feedback:'答對了！SDG7不只是「潔淨」，更是「可負擔」與「可及」——讓偏遠社區也能掌握自己的能源命運，這才是能源正義。',
    feedbackWrong:'電費只是指標，SDG7的深層精神是讓每個社區，特別是弱勢社群，都有掌握自己能源的能力。',
    ecoBiz:'適合：企業碳抵換在地合作、再生能源ESG供應鏈',

];

const DICE_FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];
let state = { currentPos:0, visited:new Set(), rolling:false, cardOpen:false };

// ── INIT ─────────────────────────────────────────────────────────────────────
function init() {
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 55; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random()*2.5+0.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s;animation-duration:${2+Math.random()*3}s;`;
    starsEl.appendChild(s);
  }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el = document.getElementById('screen-'+id);
  if (el) el.classList.add('active');
}

function startGame() {
  showScreen('game');
  renderStops();
  updateToken(0, true);
  updateUI();
}

// ── RENDER STOPS ─────────────────────────────────────────────────────────────
function renderStops() {
  const container = document.getElementById('stops-container');
  container.innerHTML = '';

  // Update SVG path
  const pts = STOPS.map(s => `${s.mapX/100*300},${s.mapY/100*520}`);
  document.getElementById('path-polyline').setAttribute('points', pts.join(' '));

  STOPS.forEach(stop => {
    const el = document.createElement('div');
    el.className = 'map-stop';
    el.id = 'stop-' + stop.id;
    el.style.left = stop.mapX + '%';
    el.style.top  = stop.mapY + '%';

    // ★ 修正：所有地點都可點選，不限已探索
    el.onclick = () => openCard(stop);

    el.innerHTML = `
      <div class="stop-pin" style="background:${stop.color}28;border-color:${stop.color}66;">
        <span>${stop.emoji}</span>
        <div class="stop-sdg-badge" style="background:${stop.color}">SDG${stop.sdg}</div>
        <div class="stop-visited-mark" id="visited-${stop.id}">✓</div>
      </div>
      <div class="stop-label">${stop.region}</div>
    `;
    container.appendChild(el);
  });
}

// ── TOKEN ─────────────────────────────────────────────────────────────────────
function updateToken(stopIndex, instant=false) {
  const token = document.getElementById('player-token');
  let x, y;
  if (stopIndex === 0) {
    x = 72; y = 14; // 花蓮市附近
  } else {
    const stop = STOPS[stopIndex-1];
    x = stop.mapX; y = stop.mapY - 8;
  }
  if (instant) {
    token.style.transition='none';
    token.style.left=x+'%'; token.style.top=y+'%';
    setTimeout(()=>{token.style.transition='';},50);
  } else {
    token.style.left=x+'%'; token.style.top=y+'%';
  }
}

// ── DICE ─────────────────────────────────────────────────────────────────────
function rollDice() {
  if (state.rolling || state.cardOpen || state.visited.size >= 7) return;
  state.rolling = true;
  document.getElementById('btn-roll').disabled = true;

  const diceEl = document.getElementById('dice-display');
  diceEl.classList.add('rolling');
  const roll = Math.floor(Math.random()*6)+1;
  let ticks = 0;

  const iv = setInterval(()=>{
    diceEl.textContent = DICE_FACES[Math.floor(Math.random()*6)];
    if (++ticks >= 9) {
      clearInterval(iv);
      diceEl.classList.remove('rolling');
      diceEl.textContent = DICE_FACES[roll-1];
      finishRoll(roll);
    }
  }, 75);
}

function finishRoll(roll) {
  const nextPos = (state.currentPos % 7) + 1;
  const stop = STOPS[nextPos-1];
  document.getElementById('dice-result').innerHTML = `骰出 <strong>${roll}</strong> 點，前往 ${stop.region}…`;
  document.getElementById('position-text').textContent = `移動到：${stop.name}`;

  setTimeout(()=>{
    state.currentPos = nextPos;
    state.visited.add(stop.id);
    updateToken(nextPos);
    updatePins();
    updateUI();
    setTimeout(()=>{ state.rolling=false; openCard(stop); }, 920);
  }, 280);
}

function updatePins() {
  STOPS.forEach(stop=>{
    const pin = document.getElementById('stop-'+stop.id)?.querySelector('.stop-pin');
    const mark = document.getElementById('visited-'+stop.id);
    if (!pin) return;
    pin.classList.remove('current','visited');
    if (stop.id === state.currentPos) {
      pin.classList.add('current');
      pin.style.background = stop.color+'44';
      pin.style.borderColor = stop.color;
    } else if (state.visited.has(stop.id)) {
      pin.classList.add('visited');
      pin.style.background = stop.color+'30';
      pin.style.borderColor = stop.color+'99';
      if (mark) mark.classList.add('show');
    }
  });
}

function updateUI() {
  const n = state.visited.size;
  document.getElementById('progress-text').textContent = `已探索 ${n} / 7 個地點`;

  if (state.currentPos > 0) {
    const stop = STOPS[state.currentPos-1];
    document.getElementById('stop-preview').innerHTML = `
      <div class="preview-emoji">${stop.emoji}</div>
      <div class="preview-text">
        <div class="preview-name">${stop.name}</div>
        <div class="preview-sdg">SDG${stop.sdg} ${getSdgName(stop.sdg)} ｜ ${stop.region}</div>
      </div>
      <button class="btn-explore" onclick="openCard(STOPS[${state.currentPos-1}])">查看故事</button>
    `;
  }
  document.getElementById('btn-roll').disabled = state.cardOpen || n >= 7;
  if (n >= 7) setTimeout(showComplete, 1600);
}

// ── CARD (修正：任何時候都可開啟) ─────────────────────────────────────────────
function openCard(stop) {
  // 如果是透過地圖點選（非骰子流程），先加入visited
  if (!state.visited.has(stop.id)) {
    // 不強制加visited，讓玩家只是「預覽」，骰子流程才正式計分
  }

  state.cardOpen = true;
  document.getElementById('btn-roll').disabled = true;

  const isVisited = state.visited.has(stop.id);
  const previewNote = isVisited ? '' :
    `<div style="background:rgba(45,90,61,0.08);border:1px solid rgba(45,90,61,0.22);border-radius:8px;padding:0.5rem 0.8rem;margin-bottom:0.8rem;font-size:0.82rem;color:var(--forest);">
      💡 透過擲骰前往此地點，可正式計入探索紀錄
    </div>`;

  const snapshotRows = stop.snapshot.map(r=>`
    <div class="snapshot-row">
      <span class="snapshot-label">${r.label}</span>
      <span class="snapshot-value">${r.value}</span>
    </div>`).join('');

  const optBtns = stop.options.map((o,i)=>`
    <button class="task-option" onclick="checkAnswer(${stop.id},${i},${stop.answer},this)">
      ${String.fromCharCode(65+i)}. ${o}
    </button>`).join('');

  document.getElementById('card-container').innerHTML = `
    <div class="card-gold-bar"></div>
    <div class="card-header">
      <div class="card-sdg-tag" style="background:${stop.color}28;color:${stop.color};border:1px solid ${stop.color}55;">
        SDG ${stop.sdg}｜${getSdgName(stop.sdg)}
      </div>
      <div class="card-hero-emoji">${stop.emoji}</div>
      <div class="card-location-name">${stop.name}</div>
      <div class="card-region">📍 ${stop.region}，花蓮縣</div>
    </div>
    <div class="card-divider"></div>
    <div class="card-body">
      ${previewNote}
      <p class="card-story">${stop.story}</p>
      <div class="snapshot-mini">
        <div class="snapshot-mini-title">📊 Social Impact Snapshot（社會影響力速寫）</div>
        ${snapshotRows}
        <div style="font-size:0.66rem;color:rgba(26,32,16,0.4);margin-top:0.5rem;">
          ＊ 企業合作潛力｜${stop.ecoBiz}
        </div>
      </div>
      <div class="task-box">
        <div class="task-title">🎯 永續思考任務</div>
        <div class="task-content">${stop.task}</div>
        <div class="task-options" id="task-opts-${stop.id}">${optBtns}</div>
        <div class="answer-feedback" id="fb-${stop.id}"></div>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn-close-card" onclick="closeCard()">返回地圖</button>
      <button class="btn-continue" onclick="closeCard()">繼續探索 →</button>
    </div>
  `;
  document.getElementById('screen-card').classList.add('active');
  document.getElementById('card-container').scrollTop = 0;
}

function checkAnswer(stopId, chosen, correct, btn) {
  const stop = STOPS.find(s=>s.id===stopId);
  document.querySelectorAll(`#task-opts-${stopId} .task-option`).forEach((b,i)=>{
    b.onclick = null;
    if (i===correct) b.classList.add('correct');
    else if (i===chosen && chosen!==correct) b.classList.add('wrong');
  });
  const fb = document.getElementById('fb-'+stopId);
  fb.classList.add('show');
  if (chosen===correct) {
    fb.classList.add('right');
    fb.textContent='✅ '+stop.feedback;
  } else {
    fb.classList.add('wrong-fb');
    fb.textContent='💡 '+stop.feedbackWrong;
  }
}

function closeCard() {
  document.getElementById('screen-card').classList.remove('active');
  state.cardOpen = false;
  document.getElementById('btn-roll').disabled = state.visited.size >= 7;
  updateUI();
}

// ── COMPLETE ─────────────────────────────────────────────────────────────────
function showComplete() {
  showScreen('complete');
  const grid = document.getElementById('complete-sdgs');
  STOPS.forEach((stop,i)=>{
    const el = document.createElement('div');
    el.className = 'complete-sdg';
    el.style.cssText=`background:${stop.color};animation-delay:${i*0.12}s`;
    el.innerHTML=`<span style="font-size:1.1rem">${stop.emoji}</span><span>SDG${stop.sdg}</span>`;
    grid.appendChild(el);
  });
}

function restartGame() {
  state={currentPos:0,visited:new Set(),rolling:false,cardOpen:false};
  document.getElementById('complete-sdgs').innerHTML='';
  document.getElementById('dice-display').textContent='🎲';
  document.getElementById('dice-result').textContent='按下骰子，開始探索花蓮';
  document.getElementById('position-text').textContent='💡 任何時候都可點選地圖上的圓點查看故事';
  document.getElementById('stop-preview').innerHTML=`
    <div class="preview-emoji">🗺️</div>
    <div class="preview-text">
      <div class="preview-name">準備出發</div>
      <div class="preview-sdg">擲骰移動，或直接點地圖圓點查看各地故事</div>
    </div>`;
  showScreen('game');
  renderStops();
  updateToken(0,true);
  updateUI();
}

function getSdgName(n) {
  return {1:'終結貧窮',2:'消除飢餓',3:'健康與福祉',4:'優質教育',5:'性別平權',6:'淨水及衛生',7:'潔淨能源'}[n]||'';
}

init();
</script>
